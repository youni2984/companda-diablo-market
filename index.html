<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Companda D2R 매찬 분석기</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <section class="card hero">
      <h1>Companda D2R 매찬 분석기</h1>
      <p>게임 값을 조작하지 않고 현재 매찬(MF)의 실효 효율과 파밍 기대 효율을 계산합니다.</p>
    </section>

    <section class="card controls">
      <label for="mf">현재 매찬 %</label>
      <input id="mf" type="number" min="0" max="5000" step="1" value="250" />

      <label for="runs">시간당 평균 사냥 횟수</label>
      <input id="runs" type="number" min="1" max="1000" step="1" value="20" />

      <button id="calc">계산</button>
    </section>

    <section class="grid" id="results"></section>

    <section class="card note">
      <h2>주의</h2>
      <p>MF는 아이템의 품질 판정에 영향을 주며 룬 드랍 수량 자체를 늘리는 수치가 아닙니다. 매찬이 높아도 처치 속도가 크게 떨어지면 시간당 효율은 오히려 낮아질 수 있습니다.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
